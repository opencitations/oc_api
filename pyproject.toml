[project]
name = "oc-api"
version = "0.11.8"
description = "OpenCitations API"
authors = [
    {name = "Mario Petrella", email = "mario.petrella@unibo.it"},
    {name = "Ivan Heibi", email = "ivan.heibi2@unibo.it"},
    {name = "Arcangelo Massari", email = "arcangelo.massari@unibo.it"}
]
license = {text = "ISC"}
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "gevent>=1.4",
    "gitpython>=3.1.50",
    "gunicorn>=22.0.0",
    "python-dateutil>=2.9.0.post0",
    "ramose>=2.7.0",
    "rdflib>=6.1.1",
    "redis>=7.0.1",
    "requests>=2.32.4",
    "web-py>=0.62",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pyright>=1.1.410",
    "pyshacl>=0.31.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pyyaml>=6.0.3",
    "qlever>=0.5.45",
    "ruff>=0.15.5",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
pythonpath = "."

[tool.coverage.run]
source = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
