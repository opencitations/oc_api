[project]
name = "oc-api"
version = "4.3.1"
description = "OpenCitations API"
authors = [
    {name = "Mario Petrella", email = "mario.petrella@unibo.it"},
    {name = "Ivan Heibi", email = "ivan.heibi2@unibo.it"},
    {name = "Arcangelo Massari", email = "arcangelo.massari@unibo.it"}
]
license = {text = "ISC"}
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "gevent>=26.9.0",
    "gitpython>=3.2.1",
    "gunicorn[gevent]>=27.0.1",
    "idna>=3.20",
    "python-dateutil>=2.9.0.post0",
    "ramose>=2.10.3",
    "rdflib>=7.6.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "certifi>=2026.10.18",
    "urllib3>=2.8.0",
    "web-py>=0.76",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pyright>=1.1.410",
    "pyshacl>=0.31.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pyyaml>=6.0.3",
    "qlever>=0.5.45",
    "ruff>=0.15.5",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
pythonpath = "."

[tool.coverage.run]
source = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
